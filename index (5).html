/* ---- choices that stop the game (7-pass, 10-discard, exchange) and results ---- */
function nextActiveSeat(v, from) {
  const N = v.players.length;
  for (let k = 1; k < N; k++) { const j = (from + k) % N; if (v.players[j].place === null) return j; }
  return from;
}
function pickChips(v) {
  return `<div class="god-hand" role="group" aria-label="${esc(t('pick.cards'))}">${v.hand.map(c => `<button class="chip${c.s === 'H' || c.s === 'D' ? ' red' : ''}${c.r === 16 ? ' jk' : ''}" data-act="pickcard" data-id="${esc(c.id)}" aria-pressed="${App.ui.pick.has(c.id)}" aria-label="${esc(cardLabel(c.s, c.r))}">${c.r === 16 ? suitSvg('X') : suitSvg(c.s)}${c.r === 16 ? '' : esc(rankShort(c.r))}</button>`).join('')}</div>`;
}
ACTIONS.pickcard = el => { const id = el.dataset.id; if (App.ui.pick.has(id)) App.ui.pick.delete(id); else App.ui.pick.add(id); renderModal(); };
ACTIONS.pickto = el => { App.ui.pickTarget = +el.dataset.i; renderModal(); };

function syncSystemModal(v) {
  if (App.ui.deal) return; /* wait for the cards to land */
  const me = v.seat, lastId = v.log.length ? v.log[v.log.length - 1].id : 0;
  let key = '', spec = null;
  if (v.kind === 'napoleon') {
    if (v.phase === 'kitty' && v.nap === me) { key = 'kit:' + v.deals; spec = { type: 'kit' }; }
    else if (v.phase === 'roundEnd' || v.phase === 'gameEnd') { key = v.phase + ':' + v.round; spec = { type: 'results' }; }
  } else if (v.phase === 'exchange' && v.pending) {
    const it = v.pending.items.find(i => i.winner === me && !i.done);
    if (it) { key = 'xch:' + v.round + ':' + me; spec = { type: 'xch', it }; }
  } else if (v.phase === 'play' && v.pending && v.pending.seat === me && (v.pending.type === 'seven' || v.pending.type === 'ten')) {
    key = v.pending.type + ':' + lastId; spec = { type: v.pending.type, n: Math.min(v.pending.n, v.hand.length) };
  } else if (v.phase === 'roundEnd' || v.phase === 'gameEnd') { key = v.phase + ':' + v.round; spec = { type: 'results' }; }
  if (key === App.ui.sysKey) return;
  if (!key) { closeSystemModal(); return; }
  App.ui.sysKey = key; App.ui.pick = new Set(); App.ui.pickTarget = null;
  if (spec.type === 'kit') openModal('kit', () => napKittySpec(), { system: true, lock: true });
  else if (spec.type === 'results') openModal('results', () => resultsSpec(), { system: true });
  else if (spec.type === 'xch') openModal('xch', () => xchSpec(spec.it), { system: true, lock: true });
  else openModal(spec.type, () => pendSpec(spec.type, spec.n), { system: true, lock: true });
}
function pendSpec(type, n) {
  const v = V(), me = v.seat;
  const needTarget = type === 'seven' && v.cfg.pass7Choose;
  const target = App.ui.pickTarget !== null ? App.ui.pickTarget : nextActiveSeat(v, me);
  const targets = v.players.map((p, i) => ({ p, i })).filter(({ p, i }) => i !== me && p.place === null);
  const ok = App.ui.pick.size === n;
  return {
    title: t(type === 'seven' ? 'pend.seven.title' : 'pend.ten.title'), icon: 'swap',
    body: `<p>${esc(t(type === 'seven' ? 'pend.seven.body' : 'pend.ten.body', { n }))}</p>
      ${needTarget ? `<div class="sec"><span class="lab">${esc(t('pend.target'))}</span><div class="pickrow">${targets.map(({ i }) => `<button class="btn sm" data-act="pickto" data-i="${i}" aria-pressed="${target === i}">${esc(pname(i))}</button>`).join('')}</div></div>` : ''}
      ${pickChips(v)}<p class="note num">${esc(t('pick.count', { a: App.ui.pick.size, n }))}</p>`,
    footer: `<button class="btn primary" data-act="pendok" data-type="${type}"${ok ? '' : ' disabled'}>${icon('check')}${esc(t('confirm'))}</button>`
  };
}
ACTIONS.pendok = el => {
  const v = V(), ids = [...App.ui.pick], type = el.dataset.type;
  if (type === 'seven') act({ t: 'seven', target: App.ui.pickTarget !== null ? App.ui.pickTarget : nextActiveSeat(v, v.seat), ids });

function xchSpec(it) {
  const v = V(), got = v.hand.filter(c => (it.got || []).includes(c.id));

/* ================= Play assist: marks, suggestions and settings UI ================= */
/* Which cards to light up or dim for the player's current turn. Uses only the player's hand and the public field. */
function assistMarks() {
  if (isNap()) return napMarks();
  const out = { glow: new Set(), dim: new Set(), none: false };
  const v = V();
  if (!v || !ASSIST.on || !myTurn()) return out;
  const st = { field: v.field, inv: v.inv, cfg: v.cfg };
  const plays = legalPlays(v.hand, st);
  out.none = !plays.length;
  const sel = [...App.ui.sel].filter(id => v.hand.some(c => c.id === id));
  let pool = plays;
  if (sel.length && ASSIST.sel) {
    const sub = plays.filter(pl => sel.every(id => pl.cards.some(c => c.id === id)));
    if (sub.length) pool = sub;
  } else if (!v.field) return out; /* leading with nothing picked: every card is playable, so there is nothing to mark */
  const ok = new Set();
  pool.forEach(pl => pl.cards.forEach(c => ok.add(c.id)));
  v.hand.forEach(c => {
    if (sel.includes(c.id)) return;
    if (ok.has(c.id)) { if (ASSIST.glow) out.glow.add(c.id); } else if (ASSIST.dim) out.dim.add(c.id);
  });
  return out;
}
/* Cheap, readable heuristic: spend weak cards first, keep pairs together and the Joker back, and go out when possible. */
function suggestPlay(v) {
  const plays = legalPlays(v.hand, { field: v.field, inv: v.inv, cfg: v.cfg });
  if (!plays.length) return null;
  const score = pl => {
    const ids = pl.cards.map(c => c.id), rest = v.hand.filter(c => !ids.includes(c.id));
    let s = pl.key;
    if (pl.cards.some(isJoker)) s += 40;
    pl.cards.forEach(c => { if (!isJoker(c) && rest.some(x => x.r === c.r)) s += 4; });
    s -= pl.cards.length * 1.5;
    if (!rest.length) s -= 100;
    return s;
  };
  return plays.reduce((a, b) => (score(b) < score(a) ? b : a));
}
function applyAssist() {
  App.ui.marks = assistMarks(); dirty($('#hand'));
  $$('#hand .card').forEach(el => {
    const id = el.dataset.id;
    el.classList.toggle('glow', App.ui.marks.glow.has(id));
    el.classList.toggle('dim', App.ui.marks.dim.has(id));
  });
  return App.ui.marks;
}
ACTIONS.hint = () => {
  if (!ASSIST.on) return;
  if (isNap()) { napHintAct(); return; }
  const v = V();
  if (!v || !myTurn()) return;
  const sg = suggestPlay(v);
  if (!sg) { App.ui.sugg = ''; App.ui.sel = new Set(); layoutHand(); renderActs(); return; }
  App.ui.sel = new Set(sg.cards.map(c => c.id));
  App.ui.sugg = [...App.ui.sel].sort().join(',');
  layoutHand(); renderActs();
};

  return `<div class="sec"><span class="lab">${esc(t('assist.title'))}</span><p class="note">${esc(t('assist.lead'))}</p>
    ${roomAssist() ? '' : `<p class="note"><b>${esc(t('assist.room.off'))}</b></p>`}
    <div class="rule-grid assist-grid">${sw('on', ASSIST.pref, !roomAssist())}${ASSIST_KEYS.map(k => sw(k, ASSIST[k], !ASSIST.on)).join('')}</div></div>`;
}
ACTIONS.assistSet = el => {
  const k = el.dataset.k, id = el.id;

/* ================= Table motion: dealing, playing and sweeping cards =================
   Every flight is an overlay card on #fx that is removed when it lands, so the real DOM
   (hand, pile, seats) is never moved and can be re-rendered at any time. */
const FX = { gap: 24, dur: 470 };
const fxReduced = () => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
const fxOk = () => !fxReduced() && !!$('#fx') && typeof Element.prototype.animate === 'function';
const isNap = () => !!(V() && V().kind === 'napoleon');
const rndIn = (a, b) => a + Math.random() * (b - a);

/* centre and size of an element in client coordinates */
function fxBox(el) {
  if (!el) return null;
  const r = el.getBoundingClientRect();
  return { cx: r.left + r.width / 2, cy: r.top + r.height / 2, w: el.offsetWidth || r.width, h: el.offsetHeight || r.height, l: r.left, t: r.top };
}
const seatEl = i => { const v = V(); return i === v.seat ? $('#me .seat') : $(`#opps [data-seat="${i}"]`) || $(`.seat[data-seat="${i}"]`); };
const seatAnchor = i => { const e = seatEl(i); return e ? fxBox($('.pl', e) || e) : null; };

/* One card flying from `o.from` to `o.to` (client coordinates). o.card: the face (omit for a back);
   o.flip: start face down and turn over on the way. */
function fxFly(o) {
  const f = $('#fx'); if (!f) return null;
  const fo = f.getBoundingClientRect(), w = Math.max(20, o.to.w), h = w * 1.4;
  const el = document.createElement('div');
  el.className = 'fx-card'; el.style.cssText = `--cw:${w}px;width:${w}px;height:${h}px`;
  el.innerHTML = `<div class="fl"><div class="ff">${o.card ? cardHtml(o.card) : ''}</div><div class="fb">${cardBack()}</div></div>`;
  f.appendChild(el);
  const fx = x => x - fo.left - w / 2, fy = y => y - fo.top - h / 2;
  const x0 = fx(o.from.cx), y0 = fy(o.from.cy), x1 = fx(o.to.cx), y1 = fy(o.to.cy);
  const s0 = Math.max(.25, (o.from.w || w) / w), r0 = o.rot0 || 0, r1 = o.to.rot || 0;
  const dur = o.dur || FX.dur, delay = o.delay || 0, arc = o.arc === undefined ? 26 : o.arc;
  const tf = (x, y, r, s) => `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${r.toFixed(1)}deg) scale(${s.toFixed(3)})`;
  const a = el.animate([
    { transform: tf(x0, y0, r0, s0), offset: 0 },
    { transform: tf((x0 + x1) / 2, (y0 + y1) / 2 - arc, (r0 + r1) / 2, (s0 + 1) / 2 + .08), offset: .6 },
    { transform: tf(x1, y1, r1, 1), offset: 1 }
  ], { duration: dur, delay, easing: 'cubic-bezier(.22, .7, .3, 1)', fill: 'both' });
  const fl = $('.fl', el);
  if (o.flip) fl.animate([{ transform: 'rotateY(180deg)', offset: 0 }, { transform: 'rotateY(180deg)', offset: .18 }, { transform: 'rotateY(0deg)', offset: .72 }, { transform: 'rotateY(0deg)', offset: 1 }], { duration: dur, delay, fill: 'both', easing: 'ease-in-out' });
  else if (!o.card) fl.style.transform = 'rotateY(180deg)';
  const done = () => { el.remove(); if (o.onland) o.onland(); };
  a.onfinish = done; a.oncancel = () => el.remove();

}

/* ---------- dealing ---------- */
const lastDealIdx = v => { for (let i = v.log.length - 1; i >= 0; i--) if (v.log[i].k === 'deal') return i; return -1; };
/* Called before a view is rendered: is this a freshly dealt round? If so, plan the deal. */
function planDeal(v, wasGame) {
  App.ui.deal = null;
  if (!wasGame) App.ui.dealKey = '';
  if (fxReduced()) return false;
  const idx = lastDealIdx(v); if (idx < 0) return false;
  const d = v.log[idx], key = String(d.id);
  if (key === App.ui.dealKey) return false;
  App.ui.dealKey = key;
  const fresh = v.kind === 'napoleon' ? v.log.length - idx <= 2 : !v.log.slice(idx + 1).some(e => e.k === 'play' || e.k === 'pass');
  if (!fresh) return false;
  const N = v.players.length, start = d.id % N, order = [], pos = {};
  for (let k = 0; k < N; k++) { const s = (start + k) % N; order.push(s); pos[s] = k; }
  const per = Math.max.apply(null, v.players.map(p => p.n));
  const gap = Math.max(10, Math.min(FX.gap, Math.round(1500 / (per * N))));
  const arr = {};
  shuffle(v.hand.map(c => c.id)).forEach((id, j) => { arr[id] = (j * N + pos[v.seat]) * gap; });
  const kit = v.kind === 'napoleon' ? (v.kn || 3) : 0;
  const t0 = Date.now();
  App.ui.deal = { t0, N, gap, pos, order, arr, per, kit, counts: v.players.map(p => p.n), end: t0 + (per * N + kit) * gap + FX.dur + 160 };
  return true;
}
/* how many cards a seat shows right now while the deal is under way */
function dealShown(i, n) {
  const d = App.ui.deal; if (!d) return n;
  const el = Date.now() - d.t0 - FX.dur; if (el < 0) return 0;
  const k = Math.floor(el / d.gap - d.pos[i]);
  return Math.min(n, k < 0 ? 0 : Math.floor(k / d.N) + 1);
}
/* delay (ms from now) before one of my hand cards has arrived; 0 when it is already there */
function dealWait(id) {
  const d = App.ui.deal; if (!d || d.arr[id] === undefined) return 0;
  return Math.max(0, d.arr[id] + FX.dur - (Date.now() - d.t0));
}
function launchDeal() {
  const d = App.ui.deal; if (!d) return;
  if (!fxOk()) { d.end = 0; endDeal(); return; }
  const v = V(), deck = fxBox($('#pile') || $('#trick') || $('.rcenter')); if (!deck) { endDeal(); return; }
  const f = $('#fx'), fo = f.getBoundingClientRect();
  const dk = document.createElement('div'); dk.className = 'fx-deck';
  dk.style.cssText = `--cw:46px;left:${deck.cx - fo.left - 23}px;top:${deck.cy - fo.top - 32}px`;
  dk.innerHTML = [0, 1, 2, 3, 4].map(i => cardBack(`left:${-i * .8}px;top:${-i * .8}px`)).join('');
  f.appendChild(dk); d.deck = dk;
  const from = { cx: deck.cx, cy: deck.cy, w: 46 };
  const hand = {}; $$('#hand .card').forEach(el => { hand[el.dataset.id] = el; });
  for (let k = 0; k < d.per * d.N; k++) {
    const s = d.order[k % d.N], j = Math.floor(k / d.N);
    if (s === v.seat || j >= d.counts[s]) continue;
    const to = seatAnchor(s); if (!to) continue;
    fxFly({ from, to: { cx: to.cx, cy: to.cy, w: 34, rot: rndIn(-25, 25) }, rot0: rndIn(-12, 12), delay: k * d.gap, arc: 12 });
  }
  v.hand.forEach(c => {
    const el = hand[c.id], b = fxBox(el); if (!b) return;
    fxFly({ card: c, flip: true, from, to: { cx: b.cx, cy: b.cy, w: b.w, rot: parseFloat(el.style.getPropertyValue('--rot')) || 0 }, rot0: rndIn(-14, 14), delay: d.arr[c.id], arc: 40 });
  });
  if (d.kit) {
    const kb = fxBox($('#kitty'));
    if (kb) for (let k = 0; k < d.kit; k++) fxFly({ from, to: { cx: kb.cx + (k - 1) * 30, cy: kb.cy, w: 40, rot: (k - 1) * 6 }, delay: (d.per * d.N + k) * d.gap, arc: 10 });
  }
  clearInterval(App.ui.dealTick);
  App.ui.dealTick = setInterval(() => { if (!App.ui.deal) return; refreshSeats(); }, 90);
  setTimeout(endDeal, Math.max(0, d.end - Date.now()));
}
function endDeal() {
  const d = App.ui.deal;
  if (d && d.end > Date.now() + 50) return; /* a newer deal replaced this one */
  clearInterval(App.ui.dealTick);
  if (d && d.deck) d.deck.remove();
  App.ui.deal = null;
  if (App.screen === 'game' && V()) { try { updateGame(); syncSystemModal(V()); } catch (e) {} }
}
function refreshSeats() {
  if (!V()) return;
  if (isNap()) { napSeats(); return; }
  renderOpps();
}
/* how long the host's bots should hold back after a deal starts */
function dealMs(total) { return Math.min(2600, Math.max(600, total * 26 + FX.dur + 250)); }

/* ---------- playing ---------- */
/* remember where the cards I am about to play are, so they can leave from there */
function rememberPlay(ids) {
  const boxes = {};
  ids.forEach(id => { const el = $(`#hand .card[data-id="${id}"]`); const b = fxBox(el); if (b) boxes[id] = { cx: b.cx, cy: b.cy, w: b.w, rot: parseFloat(el.style.getPropertyValue('--rot')) || 0 }; });
  App.ui.mySrc = { t: Date.now(), boxes };
}
/* cards fly from a seat (or my hand) onto the already-rendered, still hidden .play element */
function fxLand(seat, playEl, sig, cards) {
  if (!fxOk() || !playEl) { App.ui.landSig = ''; if (playEl) playEl.classList.remove('landing'); return false; }
  const v = V(), mine = seat === v.seat, ms = App.ui.mySrc, recent = ms && Date.now() - ms.t < 6000;
  const els = $$('.card', playEl), anchor = mine ? fxBox($('#hand')) : seatAnchor(seat);
  App.ui.landSig = sig;
  let finished = false;
  const finish = () => {
    if (finished) return; finished = true;
    App.ui.landSig = '';
    if (App.ui.landIds) App.ui.landIds.delete(sig);
    $$('.felt .landing').forEach(p => {
      if (p.dataset.cid && App.ui.landIds && App.ui.landIds.has(p.dataset.cid)) return;
      p.classList.remove('landing'); p.classList.add('thud'); setTimeout(() => p.classList.remove('thud'), 320);
    });

  els.forEach((el, i) => {
    const c = cards[i], to = fxBox(el); if (!c || !to) return;
    const sb = mine && recent && ms.boxes[c.id];
    const from = sb ? sb : (anchor ? { cx: anchor.cx, cy: mine ? anchor.cy - anchor.h * .2 : anchor.cy, w: mine ? to.w : 30 } : { cx: to.cx, cy: to.cy - 90, w: to.w });
    fxFly({
      card: c, flip: !mine, from, to: { cx: to.cx, cy: to.cy, w: to.w, rot: parseFloat(playEl.style.getPropertyValue('--rot')) || 0 },
      rot0: sb ? sb.rot : rndIn(-10, 10), delay: i * 55, dur: 440, arc: 34,
      onland: i === els.length - 1 ? finish : null

/* ---------- collecting a finished trick ---------- */
function fxGhost(el) {
  const f = $('#fx'), fo = f.getBoundingClientRect(), r = el.getBoundingClientRect(), W = el.offsetWidth, H = el.offsetHeight;
  const g = document.createElement('div'); g.className = 'fx-ghost';
  const c = el.cloneNode(true);
  c.classList.remove('landing', 'old', 'still', 'thud', 'sel', 'win');
  ['left', 'top', 'right', 'bottom'].forEach(k => { c.style[k] = 'auto'; });
  c.style.position = 'relative'; c.style.transform = 'none'; c.style.margin = '0'; c.style.animation = 'none'; c.style.opacity = '1'; c.style.filter = 'none';
  const cardEl = el.classList.contains('card') ? el : $('.card', el);
  if (cardEl) { g.style.setProperty('--fw-card', cardEl.offsetWidth + 'px'); g.style.setProperty('--tw', cardEl.offsetWidth + 'px'); }
  if (el.classList.contains('card')) c.style.setProperty('--cw', el.offsetWidth + 'px');
  g.appendChild(c);
  g.style.cssText += `;width:${W}px;height:${H}px;left:${r.left + r.width / 2 - W / 2 - fo.left}px;top:${r.top + r.height / 2 - H / 2 - fo.top}px`;
  f.appendChild(g);
  return { g, cx: r.left + r.width / 2, cy: r.top + r.height / 2 };
}
/* slide the given table elements towards a seat (or off the top edge) and let them go */
function fxSweep(nodes, seat) {
  if (!fxOk() || !nodes.length) return;
  const to = seat >= 0 ? seatAnchor(seat) : null;
  nodes.forEach((n, i) => {
    const { g, cx, cy } = fxGhost(n);
    const dx = to ? to.cx - cx : rndIn(-40, 40), dy = to ? to.cy - cy : -160;
    const rot = rndIn(-28, 28);
    const a = g.animate([
      { transform: 'translate(0, 0) rotate(0deg) scale(1)', opacity: 1 },
      { transform: `translate(${(dx * .08).toFixed(1)}px, ${(dy * .08 + 6).toFixed(1)}px) rotate(${(rot * .15).toFixed(1)}deg) scale(1.03)`, opacity: 1, offset: .18 },
      { transform: `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) rotate(${rot.toFixed(1)}deg) scale(.45)`, opacity: .0 }
    ], { duration: 520, delay: i * 40, easing: 'cubic-bezier(.5, 0, .8, .4)', fill: 'both' });
    a.onfinish = () => g.remove(); a.oncancel = () => g.remove();
  });
}

/* ================= Round table shared by every game =================
   - seats on an ellipse in turn order (me at the bottom, play runs clockwise), each holding a fan of face-down cards
   - an orbit line with arrows, and a bright arc from the player on turn to the next one
   - time-limit chips on the seats, the host's CPU speed slider, and a button bar whose slots never move */

/* ---------- geometry ---------- */
const ringAng = (k, N) => Math.PI / 2 + k * 2 * Math.PI / N;
function ringGeom() {
  const el = $('#ring'); if (!el) return null;
  const W = el.clientWidth || 600, H = el.clientHeight || 340, cs = getComputedStyle(el), px = (k, d) => parseFloat(cs.getPropertyValue(k)) || d;
  const pw = px('--pw', 130), ph = px('--ph', 52), wcw = px('--wcw', 28), hcw = px('--hcw', 44), hin = px('--hin', 24);
  /* opponents sit near the rim of the table; the big face-down hand behind each plate runs off the edge of the felt.
     `hin` is how far a plate is kept from the rim, so that the hand still shows. */
  const top = hin + 2, bot = 16;
  const rx = Math.max(10, (W - pw) / 2 - hin), ry = Math.max(10, (H - ph - top - bot) / 2);
  return { W, H, pw, ph, rx, ry, cx: W / 2, cy: top + ph / 2 + ry, wcw, wch: Math.round(wcw * 1.4), hcw, hch: Math.round(hcw * 1.4), hin, occ: [] };
}
/* slots for cards played to the middle, one per seat, on a smaller ellipse inside the ring; the card size is the largest that never overlaps */
function trickLayout(g, N) {
  const big = N >= 7;      /* seven or eight players: the cards use all the room between the plates, and drop the names when that is still too tight */
  const mk = (tw, lab) => {
    const hh = tw * .7 + (lab ? 8 : 0);
    const rx = big ? Math.max(g.rx * .5, g.rx - g.pw / 2 - tw / 2 - 8) : g.rx * .5, ry = big ? Math.max(g.ry * .46, g.ry - g.ph / 2 - hh - 6) : g.ry * .46, pts = [];
    for (let k = 0; k < N; k++) { const a = ringAng(k, N); pts.push([g.cx + rx * Math.cos(a), g.cy + ry * Math.sin(a)]); }
    return pts;
  };
  const fits = (pts, tw, lab) => {
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) if (Math.abs(pts[i][0] - pts[j][0]) < tw * 1.06 && Math.abs(pts[i][1] - pts[j][1]) < tw * 1.4 + (lab ? 16 : 3)) return false;
    return true;
  };
  for (const [lab, lo] of big ? [[true, 44], [false, 26]] : [[true, 36]])
    for (let tw = 96; tw >= lo; tw -= 2) { const pts = mk(tw, lab); if (fits(pts, tw, lab)) return { tw, pts, lab }; }
  const tw = big ? 26 : 34, lab = !big;
  return { tw, pts: mk(tw, lab), lab };
}
/* seats lie on a rounded square (squircle), so that they stay close to the rim where their hands come in from */
const sqr = v => Math.sign(v) * Math.sqrt(Math.abs(v));
function ringXY(g, a) { return [g.cx + g.rx * sqr(Math.cos(a)), g.cy + g.ry * sqr(Math.sin(a))]; }
function ringPt(g, k, N) {
  const a = ringAng(k, N), [x, y] = ringXY(g, a), c = Math.cos(a), s = Math.sin(a);
  const edge = k === 0 ? 'b' : (s < -1e-6 && Math.abs(s) >= Math.abs(c) - 1e-6) ? 't' : c < 0 ? 'l' : 'r';
  return { a, x, y, edge };
}
/* ---------- whose turn is it, and who is next ---------- */
function turnInfo(v) {
  const N = v.players.length, set = new Set(); let turn = -1, next = -1;
  if (v.kind === 'blackjack') { const r = bjTurn(v); turn = r.turn; next = r.next; (r.set || []).forEach(s => set.add(s)); }
  else if (v.kind === 'napoleon') {
    if (v.phase === 'bid') {
      turn = v.turn;
      for (let k = 1; k < N; k++) { const j = (turn + k) % N, l = v.bid && v.bid.last && v.bid.last[j]; if (!(l && l.pass)) { next = j; break; } }
    } else if (v.phase === 'kitty') turn = v.nap;
    else if (v.phase === 'play' && v.trickWin < 0) { turn = v.turn; if (v.trick.length + 1 < N) next = (turn + 1) % N; }
  } else if (v.phase === 'play') {
    const pd = v.pending;
    if (pd && pd.type === 'exchange') pd.items.forEach(it => { if (!it.done) set.add(it.winner); });
    else { turn = pd ? pd.seat : v.turn; if (!pd) { const n = nextActiveSeat(v, turn); next = n === turn ? -1 : n; } }
  } else if (v.phase === 'exchange' && v.pending && v.pending.type === 'exchange') v.pending.items.forEach(it => { if (!it.done) set.add(it.winner); });
  if (turn >= 0) set.add(turn);
  if (App.ui.deal) { set.clear(); turn = next = -1; }
  return { turn, next, set };

/* ---------- a seat ---------- */
/* A hand of big face-down cards. The cards come in from the nearest edge of the table (the fan sits behind the plate, its tips toward the
   centre) and their other ends run off the felt, so the number of cards can be read from the slivers that show. */
function fanHtml(n, g, pt, lim) {
  if (n <= 0) return '';
  const nb = Math.min(n, 16), cw = g ? g.hcw : 44, ch = g ? g.hch : 62, R = 150;
  const Lmax = Math.max(cw + 8, lim), st = nb > 1 ? Math.min(cw * .5, (Lmax - cw) / (nb - 1)) : 0, mid = (nb - 1) / 2;
  const step = st / (ch + R) * 180 / Math.PI;
  return `<span class="hfan" aria-hidden="true">${Array.from({ length: nb }, (_, j) => `<i style="--a:${((j - mid) * step).toFixed(2)}deg"></i>`).join('')}</span>`;
}
/* room along the rim for a hand: up to the next seat that uses the same edge */

}
/* o: { cls: extra classes, av: avatar html, who: name + subtitle html, badges: count badges html, fan: number of face-down cards to show, mv: html of a floating label } */
function seatShell(i, o) {
  const v = V(), N = v.players.length, g = App.ui.rg, rs = App.ui.rs || { set: new Set() };
  const me = i === v.seat, k = (i - v.seat + N) % N, pt = g ? ringPt(g, k, N) : { x: 0, y: 0, edge: 't' };
  const turn = rs.set.has(i), next = !turn && rs.next === i;
  const cls = ['seat', turn ? 'turn' : '', next ? 'next' : '', me ? 'me' : '', o.mv ? 'hasmv' : '', o.cls || ''].filter(Boolean).join(' ');
  const tag = turn ? `<span class="tag">${esc(t(me ? 'tag.you' : 'tag.turn'))}</span>` : next ? `<span class="tag next">${esc(t(me ? 'tag.next.you' : 'tag.next'))}</span>` : '';
  const bb = (App.ui.bubbles || {})[i];
  let bub = '';
  if (bb && bb.until > Date.now()) { bub = `<span class="bubble${bb.shown ? ' static' : ''}">${esc(t('stamp.' + bb.sid))}</span>`; bb.shown = true; }
  const clk = v.clk ? `<span class="clk" data-clk="${i}"><i></i><b></b></span>` : '';
  const plate = `${o.av}<span class="who">${o.who}</span><span class="rc"><span class="bdg">${o.badges}</span>${clk}</span>`;
  const mv = o.mv ? `<span class="mv${g && pt.y < g.cy - 4 ? ' dn' : ''}">${o.mv}</span>` : '';
  const won = o.won ? wonHtml(i, k, N, o.won.cards, o.won.n) : '';
  const fan = o.fan && g && !me ? fanHtml(o.fan, g, pt, fanLimit(g, k, N)) : '';

/* fills #opps and #me for the game on screen. htmlOf(i, isMe) returns one seat. */
/* ---- piles of won cards, laid face up beside each seat ----

    if (k > 0) {                                                  /* the hand that shows between the plate and the rim */

function ringOrbit() {
  const sv = $('#orbit'), g = App.ui.rg, v = V(); if (!sv || !g || !v) return;
  const N = v.players.length, rs = App.ui.rs || {}, f = n => n.toFixed(1);
  const P = a => ringXY(g, a);
  const seats = []; for (let k = 0; k < N; k++) seats.push(ringPt(g, k, N));
  const nearSeat = (x, y, m) => seats.some(s => Math.abs(x - s.x) < g.pw / 2 + m && Math.abs(y - s.y) < g.ph / 2 + m);
  const tang = a => { const [x1, y1] = P(a - .01), [x2, y2] = P(a + .01); return Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI; };

  else if (HS.mode === 'suit') {
    const order = (cx.trump !== 'N' ? [cx.trump] : []).concat(SUITS.filter(s => s !== cx.trump)), gi = c => (isJoker(c) ? (weakJ ? 9 : -1) : order.indexOf(c.s));

/* ---------- build and update ---------- */
function napBuild() {
  $('#screen').innerHTML = tableShell({ cls: 'nap', info: true, sort: true, center: `<div class="kitty" id="kitty" aria-hidden="true"></div>`, layer: `<div class="trick" id="trick"></div>` });
  App.ui.built = true; App.ui.tids = []; App.ui.pileSeen = false; App.ui.landIds = new Set(); App.ui.nfaces = null; App.ui.nbKey = ''; App.ui.nphase = ''; App.ui.mv = {}; App.ui.wonSeen = {}; App.ui.wonNew = {};
}

/* a quick pulse on a seat that has just taken picture cards */
function napFaces(v) {
  const prev = App.ui.nfaces, now = v.players.map(p => p.face);
  if (prev && prev.length === now.length) {
    now.forEach((n, i) => { if (n > prev[i]) { App.ui.bump = App.ui.bump || {}; App.ui.bump[i] = Date.now() + 900; setTimeout(() => { if (App.screen === 'game' && isNap()) napSeats(); }, 950); } });
  }

}
function napSeats() { ringSeats(napSeatHtml); }
function napRoleOf(v, i) {

  if (v.nap >= 0 && v.phase !== 'bid' && i === v.nap) return 0;

}

  else if (role >= 0) { sub = ntitle(role); rc = ' role'; }

}

/* Name labels for cards that change hands: they float next to the seat for a moment. */
function napMv(seat, html, ms) {
  if (seat < 0 || !App.ui.mv) return;
  ms = ms || 2600; App.ui.mv[seat] = { html, until: Date.now() + ms };
  setTimeout(() => {
    const m = App.ui.mv && App.ui.mv[seat];
    if (m && m.until <= Date.now() + 60 && App.screen === 'game' && V() && isNap()) { delete App.ui.mv[seat]; napSeats(); }
  }, ms + 80);
}
const mvTrump = v => `<span class="mvt">${esc(t('nap.trump.lab'))} ${suitChip(v.trump)}</span>`;
/* phase changes: kitty to Napoleon, discards back to the kitty, a trick being taken */
function napMoves(v) {
  const key = v.deals + ':' + v.phase + ':' + (v.trickWin >= 0 ? v.trickNo : '');
  const prev = App.ui.nphase; App.ui.nphase = key;
  if (!prev || prev === key || App.ui.deal) return;
  const [pd, pph, ptw] = prev.split(':');
  if (String(v.deals) !== pd) return;
  const nm = pname(v.nap);
  if (pph === 'bid' && v.phase === 'kitty' && v.nap >= 0) {
    napMv(v.nap, `<b>${esc(t('nap.mv.kitty'))}</b>${mvTrump(v)}`, 3200);
    const kb = fxBox($('#kitty .kcards')), to = seatAnchor(v.nap);
    if (fxOk() && kb && to) for (let k = 0; k < v.kn; k++) fxFly({ from: { cx: kb.cx + (k - 1) * 14, cy: kb.cy, w: 40 }, to: { cx: to.cx, cy: to.cy, w: 34, rot: rndIn(-20, 20) }, delay: k * 90, arc: 24 });
  } else if (pph === 'kitty' && v.phase === 'play' && v.nap >= 0) {
    napMv(v.nap, `<b>${esc(t('nap.mv.disc', { n: v.kn }))}</b>${mvTrump(v)}`, 2800);
    const kb = fxBox($('#kitty .kcards')), from = seatAnchor(v.nap);
    if (fxOk() && kb && from) for (let k = 0; k < v.kn; k++) fxFly({ from: { cx: from.cx, cy: from.cy, w: 34 }, to: { cx: kb.cx + (k - 1) * 14, cy: kb.cy, w: 40, rot: rndIn(-8, 8) }, delay: k * 90, arc: 24 });
  }
  if (v.trickWin >= 0 && String(v.trickNo) !== ptw) napMv(v.trickWin, `<b>${esc(t('nap.mv.takes', { n: v.trickPts }))}</b>${mvTrump(v)}`, 2800);
  void nm;
}
/* announcements from the table (banner events) also label the seat */
function napEventMv(e) {

  if (e.k === 'napDecl') napMv(e.seat, `<b>${esc(ntitle(0))}</b><span class="mvt">${e.n} ${suitChip(e.s)}</span>`, 3200);
  else if (e.k === 'adj') napMv(e.seat, `<b>${esc(ntitle(1))}</b><span class="mvt">${esc(t('banner.adj'))}</span>`, 3200);
}

}
function napInfo() {

  ch.push(flag(esc(t('round', { n: v.round, max: max > 0 ? max : '∞' })), 'dim'));
  if (v.phase === 'bid') {
    const tp = v.bid && v.bid.top;
    ch.push(tp ? flag(`${esc(t('nap.topbid'))} ${esc(pname(tp.seat))} · ${tp.n} ${suitIc(tp.s)}`) : flag(esc(t('nap.nobid')), 'dim'));
    ch.push(flag(esc(t('nap.min', { n: v.cfg.minBid })), 'dim'));
  } else if (v.nap >= 0) {

    ch.push(flag(`${esc(ntitle(0))}: ${esc(pname(v.nap))}`));

        else if (a.seat >= 0) txt = `${ntitle(1)}: ${pname(a.seat)}`;
        else txt = `${ntitle(1)}: ${chip(a.card.s, a.card.r)}${v.isAdj ? ' ' + t('nap.you') : ''}`;
        ch.push(flag(a.mode === 'card' && a.seat < 0 ? txt : esc(txt)));
      }
      if (v.phase === 'play') ch.push(flag(esc(t('nap.trickno', { n: Math.min(v.hs || 10, v.trickNo), max: v.hs || 10 })), 'dim'));

/* ---------- centre: kitty, trick, message ---------- */
function napCenter() {
  const v = V(), kit = $('#kitty');
  setHtml(kit, (v.phase === 'bid' || v.phase === 'kitty') && !App.ui.deal
    ? `<div class="kcards" style="--cw:40px">${Array.from({ length: v.kn }, (_, i) => cardBack(`left:${i * 14}px;top:0`)).join('')}</div><small>${esc(t('nap.kitty'))}</small>` : '');
  napTrick();
  const rg = $('#ring'); if (rg) rg.classList.toggle('bidding', v.phase === 'bid' || v.phase === 'kitty');
  let msg = '', kind = '';
  if (v.phase === 'bid') {
    kind = v.turn === v.seat ? 'mine' : 'thinking';
    msg = kind === 'mine' ? t('nap.msg.bid.you') : t('nap.msg.bid', { name: pname(v.turn) });
  } else if (v.phase === 'kitty') {
    kind = v.nap === v.seat ? 'mine' : 'thinking';
    msg = kind === 'mine' ? t('nap.msg.kitty.you') : t('nap.msg.kitty', { name: pname(v.nap) });
  } else if (v.phase === 'play') {
    if (v.trickWin >= 0) { msg = t('nap.msg.takes', { name: pname(v.trickWin), n: v.trickPts }); kind = 'take'; }

function napTrick() {

  const fresh = tr.filter(p => !prev.includes(p.c.id));
  const land = App.ui.landIds || (App.ui.landIds = new Set());

  }).join('') + (!tr.length && v.phase === 'play' ? `<span class="empty-pile">${esc(t('nap.empty'))}</span>` : '')

/* ---------- my seat: actions, bidding panel, hand ---------- */
const napMyTurn = () => { const v = V(); return !App.ui.deal && v.phase === 'play' && v.turn === v.seat && v.trickWin < 0; };
function napLegal(v) {
  return nLegal(v.hand, { cards: v.trick, suit: v.trickSuit }, { trump: v.trump, cfg: v.cfg }, v.trickNo);
}
function napMarks() {
  const out = { glow: new Set(), dim: new Set(), none: false }, v = V();
  if (!v || !ASSIST.on || !napMyTurn()) return out;
  const leg = new Set(napLegal(v).map(c => c.id));
  v.hand.forEach(c => { if (leg.has(c.id)) { if (v.trick.length && ASSIST.glow && leg.size < v.hand.length) out.glow.add(c.id); } else if (ASSIST.dim) out.dim.add(c.id); });
  return out;
}
function napDock() { layoutHand(); napActs(); }
function napBidInit(v) {

  const s = (App.ui.nb && App.ui.nb.s) || SUITS.slice().sort((a, b) => (cnt[b] || 0) - (cnt[a] || 0))[0];
  let n = v.cfg.minBid;

/* slots: 1 assist  2 hint  3 stamps  4 special  |  5 pass (bidding)  6 play / bid */
function napActs() {
  const v = V(), me = v.seat, host = App.role === 'host', box = $('#acts');
  if (v.phase === 'roundEnd' || v.phase === 'gameEnd') {
    const end = v.phase === 'gameEnd';
    napBidPanel(v, false);
    setHtml(box, abarHtml([null, null, v.cfg.orules ? { ic: 'spark', label: t('or.nav'), act: 'orules' } : null, { ic: 'crown', label: t('res.show'), act: 'showresults' },
      host && end ? { ic: 'home', label: t('res.lobby'), act: 'tolobby' } : null,
      host ? { ic: end ? 'play' : 'next', label: t(end ? 'res.again' : 'res.next'), act: end ? 'again' : 'nextround', primary: true } : null]));
    setHint(host ? '' : t('res.waithost'));
    return;
  }
  const can = napMyTurn(), sel = [...App.ui.sel], sc = sel.length === 1 ? v.hand.find(c => c.id === sel[0]) : null;
  const legalSel = !!(sc && napLegal(v).some(c => c.id === sc.id));
  const myBid = v.phase === 'bid' && v.turn === me && !App.ui.deal;
  const common = [

/* the hint button: a suggested bid while bidding, a suggested card while playing */

}
function napHintAct() {

function napCfgPanel(cfg, edit) {
  const dis = edit ? '' : ' disabled';
  const seg = (k, vals, lab, xc) => `<div class="seg${xc ? ' ' + xc : ''}" role="group" aria-label="${esc(t(lab))}">${vals.map(([v, l]) => `<button data-act="cfgSeg" data-k="${k}" data-v="${v}" aria-pressed="${String(cfg[k]) === String(v)}"${dis}>${esc(l)}</button>`).join('')}</div>`;
  const step = (k, fmt) => `<div class="stepper"><button data-act="cfgStep" data-k="${k}" data-d="-1" aria-label="-"${dis}>${icon('minus')}</button><span class="num">${fmt ? fmt(cfg[k]) : cfg[k]}</span><button data-act="cfgStep" data-k="${k}" data-d="1" aria-label="+"${dis}>${icon('plus')}</button></div>`;
  const rules = NAP_RULE_BOOLS.map(k => `<button class="sw" role="switch" aria-checked="${!!cfg[k]}" data-act="rule" data-k="${k}"${dis}><span class="tx">${esc(t('nrule.' + k))}<small>${esc(t('nrule.' + k + '.d'))}</small></span><span class="knob"></span></button>`).join('');
  return `<section class="panel"><h2>${icon('gear')}${esc(t('lobby.settings'))}</h2>${gameSwitch(edit)}
    <div class="cfg-grid">
      <div class="field"><span class="lab">${esc(t('cfg.seats'))}</span>${step('seats')}<small class="note">${esc(t('nap.seats.d', { h: nHandSize(cfg), k: nKittySize(cfg) }))}</small></div>
      <div class="field"><span class="lab">${esc(t('cfg.cpu'))}</span>${seg('cpuLevel', [['normal', t('cpu.normal')], ['advanced', t('cpu.advanced')]], 'cfg.cpu')}</div>
      <div class="field"><span class="lab">${esc(t('cfg.rounds'))}</span>${step('rounds', v => (v === 0 ? '∞' : v))}</div>
      <div class="field"><span class="lab">${esc(t('nrule.minBid'))}</span>${step('minBid')}</div>
    </div>
    ${pacePanel(cfg, edit)}
    ${betPanel(cfg, edit)}
    <div class="lab" style="margin-bottom:var(--s2)">${esc(t('cfg.rules'))}</div>
    <div class="rule-grid">${rules}</div>
    <div class="cfg-grid" style="margin-top:var(--s3)">
      <div class="field"><span class="lab">${esc(t('nrule.jokerMode'))}</span>${seg('jokerMode', NAP_ENUMS.jokerMode.map(x => [x, t('joker.' + x)]), 'nrule.jokerMode', 'col')}<small class="note">${esc(t('nrbr.jokerMode'))}</small></div>
      <div class="field"><span class="lab">${esc(t('nrule.seimuPos'))}</span>${seg('seimuPos', NAP_ENUMS.seimuPos.map(x => [x, t('seimu.' + x)]), 'nrule.seimuPos', 'col')}<small class="note">${esc(t('nrbr.seimuPos'))}</small></div>
    </div>
    ${titlesPanel(cfg, edit)}</section>`;
}

/* ================= boot ================= */
applyPrefs();
renderAll();
if (!PREF.setup) openAppearance(true);

})();
</script>
</body>
</html>
