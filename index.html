    case 'godgive': return s(t('log.godgive', { to: nm(a.to), card: chip(a.c[0], a.c[1]) }), 'sys');
    case 'godmove': return s(t('log.godmove', { from: nm(a.from), to: nm(a.to), n: a.n }), 'sys');
    case 'godburn': return s(t('log.godburn', { from: nm(a.from), n: a.n }), 'sys');
    case 'godtrump': return s(L('godtrump', { s: suitChip(a.s) }), 'sys');
    case 'stamp': return s(`${nm(a.seat)}: ${esc(t('stamp.' + a.sid))}`, 'say');
    case 'left': return s(t('log.left', { name: nm(a.seat) }), 'sys');
    case 'rejoin': return s(t('log.rejoin', { name: nm(a.seat) }), 'sys');
    default: return '';
  }
}
function renderNapSide() {
  const s = $('#side'); if (!s) return;
  const v = V(), tab = App.ui.sideTab;
  const old = $('.sb', s), keep = old ? old.scrollTop : 0, atEnd = !old || old.scrollHeight - old.scrollTop - old.clientHeight < 40;
  let body;
  if (tab === 'log') body = v.log.map(napLogHtml).join('') || `<p class="note">${esc(t('log.empty'))}</p>`;
  else {
    const rows = v.players.map((p, i) => ({ i, p })).sort((a, b) => b.p.score - a.p.score || a.i - b.i);
    body = `<table class="stand"><thead><tr><th>${esc(t('st.player'))}</th><th>${esc(t('nap.face'))}</th><th class="n">${esc(t('st.pts'))}</th></tr></thead><tbody>${rows.map(({ i, p }) => `<tr class="${i === v.seat ? 'me' : ''}"><td>${esc(pname(i))}</td><td class="num">${v.trickNo > 0 ? p.face : '–'}</td><td class="n num">${p.score}</td></tr>`).join('')}</tbody></table>`;
  }
  s.innerHTML = `<div class="sh"><div class="tabs" role="tablist"><button role="tab" aria-selected="${tab === 'log'}" data-act="sideTab" data-v="log">${esc(t('tab.log'))}</button><button role="tab" aria-selected="${tab === 'stand'}" data-act="sideTab" data-v="stand">${esc(t('tab.stand'))}</button></div><button class="btn ghost icon close" data-act="side" aria-label="${esc(t('close'))}">${icon('x')}</button></div><div class="sb">${body}</div>`;
  const nb = $('.sb', s);
  if (nb) nb.scrollTop = tab === 'log' && atEnd ? nb.scrollHeight : keep;
}
function napBannerText(e) {
  const trumpTxt = e.s ? suitTxt(e.s) : '';
  if (e.k === 'napDecl') return { title: t('banner.napDecl'), sub: `${pname(e.seat)} · ${e.n} ${trumpTxt}` };
  if (e.k === 'napGo') return { title: t('banner.napGo'), sub: `${e.n} ${trumpTxt}` };
  if (e.k === 'adj') return { title: t('banner.adj'), sub: pname(e.seat) };
  return null;
}

/* ---------- rulebook ---------- */
function napRulesBody() {
  const tab = App.ui.rbTab, cfg = currentCfg();
  let html = '';
  if (tab === 'basic') html = rbBlocks('rbn.basic') + `<section><h3>${esc(t('nap.rb.order'))}</h3><div class="order">${[nAlm({ trump: 'H', cfg: NAP_CFG }), { s: 'X', r: 16 }, { s: 'H', r: 11 }, { s: 'D', r: 11 }, { s: 'H', r: 14 }, { s: 'H', r: 2 }].map(c => chip(c.s, c.r)).join(' &gt; ')}</div><p class="note">${esc(t('nap.rb.order.d'))}</p></section>`;
  else if (tab === 'special') html = `<dl>${NAP_RULE_BOOLS.filter(k => k !== 'godAll').map(k => `<div><dt>${esc(t('nrule.' + k))}<span class="tag${cfg[k] ? ' on' : ''}">${esc(t(cfg[k] ? 'on' : 'off'))}</span></dt><dd>${esc(t('nrbr.' + k))}</dd></div>`).join('')}<div><dt>${esc(t('nrule.minBid'))}<span class="tag on">${cfg.minBid || 13}</span></dt><dd>${esc(t('nrbr.minBid'))}</dd></div></dl>`;
  else html = rbBlocks('rbn.custom');
  return `<div class="tabs" role="tablist" style="margin:calc(var(--s4) * -1) calc(var(--s4) * -1) 0;padding:0 var(--s3)">${['basic', 'special', 'custom'].map(k => `<button role="tab" aria-selected="${tab === k}" data-act="rbtab" data-v="${k}">${esc(t('rb.tab.' + k))}</button>`).join('')}</div><div class="rb" role="tabpanel">${html}</div>`;
}

/* ---------- lobby settings ---------- */
function napCfgPanel(cfg, edit) {
  const dis = edit ? '' : ' disabled';
  const seg = (k, vals, lab) => `<div class="seg" role="group" aria-label="${esc(t(lab))}">${vals.map(([v, l]) => `<button data-act="cfgSeg" data-k="${k}" data-v="${v}" aria-pressed="${String(cfg[k]) === String(v)}"${dis}>${esc(l)}</button>`).join('')}</div>`;
  const step = (k, fmt) => `<div class="stepper"><button data-act="cfgStep" data-k="${k}" data-d="-1" aria-label="-"${dis}>${icon('minus')}</button><span class="num">${fmt ? fmt(cfg[k]) : cfg[k]}</span><button data-act="cfgStep" data-k="${k}" data-d="1" aria-label="+"${dis}>${icon('plus')}</button></div>`;
  const rules = NAP_RULE_BOOLS.map(k => `<button class="sw" role="switch" aria-checked="${!!cfg[k]}" data-act="rule" data-k="${k}"${dis}><span class="tx">${esc(t('nrule.' + k))}<small>${esc(t('nrule.' + k + '.d'))}</small></span><span class="knob"></span></button>`).join('');
  return `<section class="panel"><h2>${icon('gear')}${esc(t('lobby.settings'))}</h2>${gameSwitch(edit)}
    <div class="cfg-grid">
      <div class="field"><span class="lab">${esc(t('cfg.seats'))}</span><span class="num fixed">5</span></div>
      <div class="field"><span class="lab">${esc(t('cfg.cpu'))}</span>${seg('cpuLevel', [['normal', t('cpu.normal')], ['advanced', t('cpu.advanced')]], 'cfg.cpu')}</div>
      <div class="field"><span class="lab">${esc(t('cfg.rounds'))}</span>${step('rounds', v => (v === 0 ? '∞' : v))}</div>
      <div class="field"><span class="lab">${esc(t('nrule.minBid'))}</span>${step('minBid')}</div>
    </div>
    <div class="lab" style="margin-bottom:var(--s2)">${esc(t('cfg.rules'))}</div>
    <div class="rule-grid">${rules}</div></section>`;
}

/* ---------- God Mode ---------- */
function napGodSpec() {
  const v = V(), tab = App.ui.godTab;
  const tabs = `<div class="tabs" role="tablist" style="margin:calc(var(--s4) * -1) calc(var(--s4) * -1) 0;padding:0 var(--s3)">${GOD_TABS.map(k => `<button role="tab" aria-selected="${tab === k}" data-act="godtab" data-v="${k}">${esc(t(k === 'ranks' ? 'ngod.tab.ranks' : 'god.tab.' + k))}</button>`).join('')}</div>`;
  const body = tab === 'ranks' ? napGodRoles(v) : tab === 'hands' ? godHands(v) : tab === 'rules' ? napGodRules(v) : godSpecial(v);
  return { title: t('god.title'), icon: 'crown', cls: 'xl', body: `${tabs}<p class="note">${esc(t('ngod.note'))}</p>${body}` };
}
function napGodRoles(v) {
  const cfg = v.cfg;
  const rows = [0, 1, 2].map(i => `<div class="rankrow"><div class="field"><label for="gt-${i}">${esc(t('ngod.role.' + i))}</label><input id="gt-${i}" class="in" maxlength="24" value="${esc(cfg.titles[i] || '')}" placeholder="${esc(t('ntitle.' + i))}"></div>
    <div class="field"><label for="gp-${i}">${esc(t('ngod.pts.' + i))}</label><input id="gp-${i}" class="in num" type="number" min="-99" max="999" value="${cfg.points[i]}"></div></div>`).join('');
  const scores = v.players.map((p, i) => `<div class="scorerow"><span class="nm">${esc(pname(i))}</span><span class="num">${p.score}</span>
    <button class="btn sm icon" data-act="godscore" data-i="${i}" data-d="-1" aria-label="${esc(t('god.score.minus', { name: pname(i) }))}">${icon('minus')}</button>
    <button class="btn sm icon" data-act="godscore" data-i="${i}" data-d="1" aria-label="${esc(t('god.score.plus', { name: pname(i) }))}">${icon('plus')}</button></div>`).join('');
  return `<div class="sec"><span class="lab">${esc(t('ngod.roles'))}</span><div class="pts">${rows}</div>
    <div class="btnrow" style="margin-top:var(--s3)"><button class="btn primary" data-act="napgodroles">${icon('check')}${esc(t('apply'))}</button><button class="btn" data-act="napgodreset">${esc(t('god.reset'))}</button></div></div>
    <div class="sec"><span class="lab">${esc(t('god.scores'))}</span>${scores}</div>`;
}
ACTIONS.napgodroles = () => {
  const titles = [0, 1, 2].map(i => document.getElementById('gt-' + i).value);
  const points = [0, 1, 2].map(i => parseInt(document.getElementById('gp-' + i).value, 10) || 0);
  godAct({ op: 'titles', titles }); godAct({ op: 'points', points }); toast(t('saved'));
};
ACTIONS.napgodreset = () => { godAct({ op: 'titles', titles: [] }); godAct({ op: 'points', points: [2, 1, 1] }); };
function napGodRules(v) {
  const cfg = v.cfg;
  const seg = (k, vals) => `<div class="seg" role="group">${vals.map(([x, l]) => `<button data-act="godcfg" data-k="${k}" data-v="${x}" aria-pressed="${String(cfg[k]) === String(x)}">${esc(l)}</button>`).join('')}</div>`;
  const trumps = SUITS.concat(cfg.noTrump ? ['N'] : []).map(s => `<button class="btn sm" data-act="godtrump" data-s="${s}"${v.phase === 'play' ? '' : ' disabled'} aria-pressed="${v.trump === s}">${s === 'N' ? esc(t('nap.nt')) : suitSvg(s)}</button>`).join('');
  return `<div class="rule-grid">${NAP_RULE_BOOLS.map(k => `<button class="sw" role="switch" aria-checked="${!!cfg[k]}" data-act="godrule" data-k="${k}"><span class="tx">${esc(t('nrule.' + k))}<small>${esc(t('nrule.' + k + '.d'))}</small></span><span class="knob"></span></button>`).join('')}</div>
    <div class="row2">
      <div class="field"><span class="lab">${esc(t('nrule.minBid'))} <span class="muted">(${esc(t('god.nextround'))})</span></span>${seg('minBid', [12, 13, 14, 15, 16].map(n => [n, String(n)]))}</div>
      <div class="field"><span class="lab">${esc(t('cfg.cpu'))}</span>${seg('cpuLevel', [['normal', t('cpu.normal')], ['advanced', t('cpu.advanced')]])}</div>
    </div>
    <div class="sec"><span class="lab">${esc(t('ngod.trump'))}</span><div class="btnrow">${trumps}</div></div>`;
}
ACTIONS.godtrump = el => godAct({ op: 'trump', s: el.dataset.s });

/* ================= boot ================= */
applyPrefs();
renderAll();
if (!PREF.setup) openAppearance(true);

})();
</script>
</body>
</html>
